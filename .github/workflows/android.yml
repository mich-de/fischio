name: APK Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Compila l'APK
        working-directory: android
        env:
          FISCHIO_URL: ${{ vars.FISCHIO_URL }}
        run: |
          chmod +x gradlew
          if [ -n "$FISCHIO_URL" ]; then URL_ARG="-Pfischio.url=$FISCHIO_URL"; else echo "::warning::Variabile FISCHIO_URL non impostata: l'APK punterà all'indirizzo di gradle.properties"; fi
          ./gradlew assembleRelease $URL_ARG --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../fischio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fischio-apk
          path: fischio.apk

      - name: Salva l'APK nel ramo apk
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp fischio.apk out/ && cd out
          git init -q -b apk && git add fischio.apk
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" apk

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fischio.apk
